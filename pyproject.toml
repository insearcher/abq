[project]
name = "abq"
version = "0.1.0"
description = "Message bus between running Claude Code and Codex sessions on one machine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
abq = "abq.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
